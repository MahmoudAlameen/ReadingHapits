<div *ngIf="result" class="result-card">
            <h2 class="result-title">Assessment Complete!</h2>
            <div class="result-summary">
                <p class="result-grade" [class.pass]="result.grade !== 'Fail'" [class.fail]="result.grade === 'Fail'">
                    {{ result.grade }}
                </p>
                
                <div class="score-display">
                    <span class="score-value">{{ result.percentage }}%</span>
                    <span class="score-label">Final Score</span>
                </div>

                <div class="metric-grid">
                    <div class="metric-item">
                        <span class="metric-value">{{ result.score }} / {{ result.maxScore }}</span>
                        <span class="metric-label">Correct Answers</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-value">{{ formatTime(timeTakenSeconds) }}</span>
                        <span class="metric-label">Time Taken</span>
                    </div>
                </div>
                
                <p class="final-message">
                    Thank you for completing the **{{ assessmentName }}** exam. You may close this window.
                </p>
            </div>
</div>
