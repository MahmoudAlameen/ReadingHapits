       <div *ngIf="question" class="question-container">
            <!-- Question Body (Rendered as trusted HTML) -->
            <div class="ql-container ql-snow">
                <div class="ql-editor" [innerHTML]="questionBodyHtml">

                </div>
            </div>

            <div class="choices-list">
                <div *ngFor="let choice of question.choices; let i = index" 
                     (click)="selectChoice(choice.id)"
                     class="choice-item"
                     [class.choice-selected]="isSelected(choice.id)"
                >
                    <div 
                        class="choice-radio"
                        [class.radio-selected]="isSelected(choice.id)"
                    ></div>
                    
                    <!-- Choice Body (Rendered as trusted HTML) -->
                     <div class="ql-container ql-snow">
                        <div class="ql-editor" [innerHTML]="sanitizeHtml(choice.content)">

                        </div>
                    </div>     
                </div>
            </div>
</div>
