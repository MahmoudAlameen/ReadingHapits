<section class="assessments-list-container">
  <div class="mobile-filter-trigger" (click)="toggleMobileFilters()">
    <button class="filter-fab">
      <span class="filter-icon"></span>
      {{ 'Filters' | translate }}
    </button>
  </div>

  <div class="filter-backdrop" *ngIf="isMobileFilterOpen" (click)="toggleMobileFilters()"></div>

  <div class="main-layout-wrapper">
    <aside class="filter-sidebar" [class.mobile-active]="isMobileFilterOpen">
      <div class="sidebar-header">
        <h3>{{ 'Filter Assessments' | translate }}</h3>
        <button class="close-menu" (click)="toggleMobileFilters()">×</button>
      </div>

      <div class="sidebar-content">
        <div class="filter-group">
          <label>{{ 'Search' | translate }}</label>
          <input
           type="text" 
           placeholder="{{ 'Assessment name...' | translate }}" 
           [value]="searchTerm"
           (input)="updateSearch($event)" 
           class="side-input" />
        </div>

        <div class="filter-group" *ngIf="!IsInternationalAssessmentMode">
          <label>{{ 'Subject' | translate }}</label>
          <select 
          (change)="updateSubjectFilter($event)"
           [value]="selectedSubjectId"
            class="side-input">
            <option value="">{{'All Subjects' | translate}}

            </option>
            <option
             *ngFor="let subject of learningSubjectsIds"
              [value]="subject.id"
              [selected]="subject.id === selectedSubjectId">
              {{ subject.name }}
            </option>
          </select>
        </div>

        <div class="filter-group" *ngIf="!IsInternationalAssessmentMode">
          <label>{{ 'Grade' | translate }}</label>
          <select 
          (change)="updateGradeFilter($event)" 
          [value]="gradeId" 
          class="side-input">
          <option value="">{{'All Grades' | translate}}</option>
          <option 
          *ngFor="let grade of gradesIds"
          [selected]="grade.id === gradeId"
           [value]="grade.id">
           {{ grade.name | translate }}
          </option>
          </select>
        </div>

        <div class="filter-group" *ngIf=" !IsComeFromTRainingPage && IsInternationalAssessmentMode">
          <label>{{ 'Subject Type' | translate }}</label>
          <select 
          (change)="updateAssessmentSubjectTypeFilter($event)"
           class="side-input">
            <option value="">{{'All Types' |translate}}</option>
            <option 
            *ngFor="let typeName of assessmentTypeSubjectsNames" 
            [value]="typeName"
             [selected]="selectedAssessmentSubjectType !== null && getAssessmentSubjectTypeName(selectedAssessmentSubjectType) === typeName"
            >
            {{ typeName }}
          </option>
          </select>
        </div>

        <div class="filter-group" *ngIf="!IsComeFromTRainingPage">
          <label>{{ 'Category' | translate }}</label>
          <select 
          (change)="updateAssessmentTypeFilter($event)" 
          class="side-input">
          <option value="">{{'All Categories' |translate}}</option>
          <option
           *ngFor="let typeName of assessmentTypeNames" 
           [value]="typeName"
           [selected]="selectedAssessmentType !== null && getFilterAssessmentTypeName(selectedAssessmentType) === typeName"
           >
           {{ typeName }}
          </option>
          </select>
        </div>

        <button (click)="resetFilters()" class="side-reset-btn">
       {{'Reset Filters'| translate}}
        </button>
      </div>
    </aside>

    <main class="assessments-results">
      <div *ngIf="isLoading" class="loader-container">
        <div class="spinner"></div>
      </div>

      <ng-container *ngIf="!isLoading">
        <section *ngFor="let category of categorizedAssessments" class="assessment-section">
          <h2 class="category-title">
            {{ getAssessmentTypeName(category.type) }}
            <span class="category-count">({{ category.assessments.length }})</span>

          </h2>

          <div class="card-grid">
            <app-assessment-card
              *ngFor="let assessment of category.assessments; trackBy: trackByFn"
              [assessment]="assessment"
              (takeClicked)="takeAssessment($event)"
            >
            </app-assessment-card>
          </div>
        </section>

        <div *ngIf="categorizedAssessments.length === 0" class="no-results">
          <p>{{ 'No assessments found matching your filters.' | translate }}</p>
        </div>
      </ng-container>
    </main>
  </div>
</section>
