<div *ngIf="meta" class="metadata-card">
            <h2 class="metadata-title">{{ meta.name }}</h2>
            <hr class="metadata-divider">
            
            <div class="metadata-details">
                <p class="metadata-row">
                    <span class="metadata-label">{{'Subject' | translate }}:</span>
                    <span class="metadata-value-primary">{{ meta.subjectName }}</span>
                </p>
                <p class="metadata-row">
                    <span class="metadata-label">{{'Duration' | translate}}:</span>
                    <span class="metadata-value-danger">{{ meta.durationInMinutes }} {{'Minutes' | translate}}</span>
                </p>
                <p class="metadata-row">
                    <span class="metadata-label">{{'Total Questions' | translate}} :</span>
                    <span class="metadata-value-primary">{{ meta.questionsCount }}</span>
                </p>
            </div>

            <button 
                (click)="onStart.emit()"
                class="start-button"
            >
                {{'Start Assessment' | translate}}
            </button>
</div>
