   <div class="card-container">
            <div class="assessment-card-wrapper">
                <!-- Main Card -->
                <div class="assessment-card">
                    
                    <!-- Card Header -->
                    <div class="card-header">
                        <h3 class="assessment-title">
                            {{ assessment.name }}
                        </h3>

                        <!-- Top Scorer Badge - Refactored: @if -> *ngIf -->
                        <div *ngIf="assessment.topScorer as scorer" class="top-scorer-badge">
                            <!-- Crown Icon (Inline SVG) -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="crown-icon"><path d="m20 6-3-4-3 4-2-4-2 4-3-4-3 4-2-4v16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2Z"/><path d="M4 22V6"/><path d="M20 22V6"/></svg>
                            <span>{{ scorer.name }}</span>
                            <span class="scorer-score-detail">({{ scorer.score }})</span>
                        </div>
                    </div>

                    <!-- Card Body -->
                    <div class="card-body">
                        <div class="meta-item">
                            <!-- Clock Icon (Inline SVG) -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="clock-icon"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            <span class="meta-label">Duration:</span>
                            <span class="meta-value">{{ assessment.durationInMinutes }} mins</span>
                        </div>
                        <label
                           [class.coming-soon]="cardLabel === 'Coming Soon'"
                            [class.take-exam]="butttonText === 'Published'"
                        >{{cardLabel | translate}}</label>
                      </div>

                    <!-- Card Footer -->
                    <div class="card-footer">
                        <button 
                        *ngIf="(assessment.status !== AssessmentStatus.Finished && !assessment.isStartedByStudent)
                        || assessment.status !== AssessmentStatus.New"
                        
                            (click)="onButtonClick()"
                            [disabled]="isButtonDisabled"
                            [title]="isButtonDisabled ? 'The exam is not available yet' : ''"
                            [class.take-exam]="butttonText === 'Start Assessment'"
                            [class.view-results]="butttonText === 'View-Result'"
                            class="action-button"
                        >
                        {{ butttonText | translate}}
                      </button>
                    </div>
                </div>
            </div>
        </div>
