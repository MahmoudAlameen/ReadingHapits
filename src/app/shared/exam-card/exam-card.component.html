   <div class="card-container">
            <div class="assessment-card-wrapper">
                <!-- Main Card -->
                <div class="assessment-card">
                    
                    <!-- Card Header -->
                    <div class="card-header">
                        <h3 class="assessment-title">
                            {{ assessment.name }}
                        </h3>

                        <!-- Top Scorer Badge - Refactored: @if -> *ngIf -->
                        <div *ngIf="assessment.topScorer as scorer" class="top-scorer-badge">
                            <!-- Crown Icon (Inline SVG) -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="crown-icon"><path d="m20 6-3-4-3 4-2-4-2 4-3-4-3 4-2-4v16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2Z"/><path d="M4 22V6"/><path d="M20 22V6"/></svg>
                            <span>{{ scorer.name }}</span>
                            <span class="scorer-score-detail">({{ scorer.score }})</span>
                        </div>
                    </div>

                    <!-- Card Body -->
                    <div class="card-body">
                        <div class="meta-item">
                            <!-- Clock Icon (Inline SVG) -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="clock-icon"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            <span class="meta-label">Duration:</span>
                            <span class="meta-value">{{ assessment.durationInMinutes }} mins</span>
                        </div>
                    </div>

                    <!-- Card Footer -->
                    <div class="card-footer">
                        <button 
                            (click)="onButtonClick()"
                            [disabled]="isButtonDisabled"
                            [title]="isButtonDisabled ? 'The exam is not available yet' : ''"
                            [class.take-exam]="buttonText === 'TakeExam'"
                            [class.coming-soon]="buttonText === 'Coming Soon'"
                            [class.view-results]="buttonText === 'View Results'"
                            class="action-button"
                        >
                            <!-- Icon determined by buttonText - Refactored: @switch -> [ngSwitch] / *ngSwitchCase -->
                            <ng-container [ngSwitch]="buttonText">
                                <svg *ngSwitchCase="'TakeExam'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                                
                                <svg *ngSwitchCase="'Coming Soon'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M10 12v6"/><path d="M14 12v6"/><path d="M17 12v6"/></svg>
                                
                                <svg *ngSwitchCase="'View Results'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s5-4 10-4 10 4 10 4"/><path d="M16 22l6-6"/><path d="M16 16l6 6"/><path d="M12 12c-3.31 0-6 2.69-6 6s2.69 6 6 6z"/><path d="m14 16-2-2-4-4"/></svg>
                            </ng-container>
                            {{ buttonText }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
