<div class="exam-card">
  <h3>{{ assessment.name }}</h3>
  <div class="meta">{{ assessment.durationInMinutes}}</div>
  <div *ngIf="assessment.topScorer" class="top-scorer">
    <i class="fas fa-medal"></i> {{ assessment.topScorer.name }} {{ assessment.topScorer.score }}
  </div>
  <button (click)="onButtonClick()">{{ buttonText | translate}}</button>
</div>
