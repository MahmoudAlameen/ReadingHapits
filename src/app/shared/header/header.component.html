    <!-- Header: Fixed at the top, light background, subtle shadow.
         [ngClass] is used to activate RTL styles when isRtl is true. -->
    <header class="header-container" [ngClass]="{'rtl-mode': isRtl}">
      <div class="header-content" [ngClass]="{'rtl-mode': isRtl}">
        
        <!-- Logo and Brand Name -->
        <div class="logo-group">
          <!-- Logo Circle (Blue) -->
          <div class="logo-circle">
            Pr
          </div>
          <!-- Brand Name -->
          <span class="brand-name">
           {{'Future Skills' | translate}}
          </span>
        </div>

        <!-- Language Switcher -->


        <!-- Desktop Navigation & Buttons (Visible on medium screens and up via media query) -->
        <div class="desktop-nav-group">
          
          <!-- Nav Link (Using *ngFor for A14 compatibility) -->
          <a *ngFor="let item of navItems; trackBy: trackByLink"
             [href]="item.link" 
             class="nav-link">
            {{ item.label }}
          </a>

          <!-- Sign Up Button (Outline) -->
          <a navi class="signup-btn" routerLink="/register">
            {{ 'Sign up' | translate}}
          </a>

          <!-- Sign In Button (Solid) -->
          <a class="signin-btn" routerLink="/login">
            {{ 'Sign In' | translate}}
          </a>
          <button class="lang-btn"  (click)="switchLanguage(languageButtonText)">{{languageButtonText}}</button>

        </div>

        <!-- Mobile Menu Button (Hamburger/X Icon - Hidden on desktop via media query) -->
        <button (click)="toggleMenu()" class="menu-button">
          <!-- Hamburger Icon (Menu) (Using *ngIf for A14 compatibility) -->
          <ng-container *ngIf="!isOpen">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </ng-container>
          <!-- Close Icon (X) (Using *ngIf for A14 compatibility) -->
          <ng-container *ngIf="isOpen">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </ng-container>
        </button>


      </div>
    </header>

    <!-- Mobile Menu Drawer and Overlay -->
    
    <!-- Dark Overlay (Click to close menu) (Using *ngIf for A14 compatibility) -->
    <div *ngIf="isOpen" 
         class="overlay" 
         (click)="toggleMenu()">
    </div>

    <!-- Side Navigation Drawer: uses [ngClass] to control the CSS transform for sliding direction -->
    <nav class="mobile-nav-drawer"
         [ngClass]="{
            'rtl-mode': isRtl,
            'is-open': isOpen
         }">
      
      <div class="mobile-nav-links">
        
        <!-- Nav Links for Mobile (Using *ngFor for A14 compatibility) -->
        <a *ngFor="let item of navItems; trackBy: trackByLink" 
           [href]="item.link" 
           class="mobile-nav-link" 
           (click)="toggleMenu()">
          <!-- Display Arabic text if in RTL mode, otherwise English -->
          {{ item.label }}
        </a>
        
        <!-- Divider -->

        <!-- Buttons for Mobile -->
        <a class="mobile-nav-link" (click)="toggleMenu()" routerLink="/register">
          {{ 'Sign up' | translate}}
        </a>

        <a class="mobile-nav-link" (click)="toggleMenu()" routerLink="/login">
          {{ 'Sign In'  | translate}}
        </a>
        <a class="lang-btn mobile-nav-link"  (click)="switchLanguage(languageButtonText); toggleMenu()">{{languageButtonText}}</a>

      </div>
    </nav>
