<div class="modal-overlay" (click)="closePopup()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closePopup()">&times;</button>
    
    <header class="modal-header">
      <h2>{{ AssessmentData?.title }}</h2>
      <p class="description">{{ AssessmentData?.description }}</p>
    </header>

    <div class="materials-grid">
      <div 
        class="material-card" 
        *ngFor="let subject of AssessmentData.subjects" 
        (click)="navigateToAssessment(AssessmentData.type, subject.id)">
        <div class="image-wrapper">
          <img [src]="subject.coverUrl" [alt]="subject.name">
        </div>
        <h3>{{ subject.name }}</h3>
      </div>
    </div>
  </div>
</div>
