<section calss ="section-container">
<header>
  <h1>{{ subjectTitle }}</h1>
  <div class="interactive-student">
    <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Student">
    {{'Most Interactive' | translate}}: Sara
    <i class="fas fa-star"></i>
  </div>
  <i class="fas fa-calculator floating-icon" style="top:10px; left:20px; animation-duration: 7s;"></i>
  <i class="fas fa-book floating-icon" style="top:40px; left:90%; animation-duration: 6s;"></i>
  <i class="fas fa-pencil-alt floating-icon" style="top:80px; left:40%; animation-duration: 8s;"></i>
</header>

<div class="floating-badge" style="top:300px; left:10%;">⭐</div>
<div class="floating-badge" style="top:500px; left:80%;">🏆</div>
<div class="floating-badge" style="top:700px; left:30%;">🎯</div>

<div class="cover">
  <img [src] = "learningSubject.coverUrl" alt="Cover Image">
</div>

<div class="teacher-avatars">
  <img  *ngFor="let teacher of learningSubject.assignedTeachers" [src]="teacher.avatarUrl" alt="Teacher">
</div>

<div class="description">
  {{ subjectDescription }}
</div>

<div class="grade-selector">
  <label for="grade">{{'Select Grade' | translate}} </label>
    <select id="grade" name="grade" [(ngModel)]="selectedGradeId"  #gradeControl="ngModel">
      <option value="" disabled selected>{{'select grade' }}</option>
      <option [selected] ="grade.id == selectedGradeId" *ngFor="let grade of grades" [value]="grade.id">{{ grade.name }}</option>
    </select>
</div>

<div class="section-container section-books">
  <h2>📚 {{'Books' | translate}}</h2>
  <div class="cards">
    <app-learning-resource-card *ngFor="let book of learningSubject.books" [resource]="book"></app-learning-resource-card>
  </div>
  <app-progress-bar
    [title]="'📖 Books Progress'"
    [progress]="60"
    [text]="'Completed 2/3 books'">
  </app-progress-bar>
</div>

<div class="section-container section-articles">
  <h2>📝 {{'Articles' |translate}}</h2>
  <div class="cards">
    <app-learning-resource-card *ngFor="let article of learningSubject.articles" [resource]="article"></app-learning-resource-card>
  </div>
  <app-progress-bar
    [title]="'📄 Articles Progress'"
    [progress]="50"
    [text]="'Completed 1/2 articles'">
  </app-progress-bar>
</div>

<div class="section-container section-exams">
  <h2>🎓 {{'Exams' | translate}}</h2>
  <div class="exam-category">
    <h3>📘 PISA</h3>
    <app-exam-card *ngFor="let exam of pisaExams" [assessment]="exam"></app-exam-card>
  </div>
  <div class="exam-category">
    <h3>📗 TIMSS</h3>
    <app-exam-card *ngFor="let exam of pisaExams" [assessment]="exam"></app-exam-card>
  </div>
  <div class="exam-category">
    <h3>📙 PIRLS</h3>
    <app-exam-card *ngFor="let exam of pisaExams" [assessment]="exam"></app-exam-card>
  </div>
  <app-progress-bar
    [title]="'📝 Exams Progress'"
    [progress]="33"
    [text]="'Completed 1/3 exams'">
  </app-progress-bar>
</div>

</section>
