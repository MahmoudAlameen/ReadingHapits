<section calss ="section-container">
<header>
  <h1>{{ subjectTitle }}</h1>
  <div class="interactive-student">
    <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Student">
    Most Interactive: Sara
    <i class="fas fa-star"></i>
  </div>
  <i class="fas fa-calculator floating-icon" style="top:10px; left:20px; animation-duration: 7s;"></i>
  <i class="fas fa-book floating-icon" style="top:40px; left:90%; animation-duration: 6s;"></i>
  <i class="fas fa-pencil-alt floating-icon" style="top:80px; left:40%; animation-duration: 8s;"></i>
</header>

<div class="floating-badge" style="top:300px; left:10%;">⭐</div>
<div class="floating-badge" style="top:500px; left:80%;">🏆</div>
<div class="floating-badge" style="top:700px; left:30%;">🎯</div>

<div class="cover">
  <img src="https://picsum.photos/900/250?random=1" alt="Cover Image">
</div>

<div class="teacher-avatars">
  <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Teacher">
  <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Teacher">
  <img src="https://randomuser.me/api/portraits/men/65.jpg" alt="Teacher">
</div>

<div class="description">
  {{ subjectDescription }}
</div>

<div class="grade-selector">
  <label for="grade">Select Grade: </label>
  <select id="grade" (change)="onGradeChange($event)">
    <option>Grade 7</option>
    <option selected>Grade 8</option>
    <option>Grade 9</option>
    <option>Grade 10</option>
  </select>
</div>

<div class="section-container section-books">
  <h2>📚 Books</h2>
  <div class="cards">
    <app-book-card *ngFor="let book of books" [book]="book"></app-book-card>
  </div>
  <app-progress-bar
    [title]="'📖 Books Progress'"
    [progress]="60"
    [text]="'Completed 2/3 books'">
  </app-progress-bar>
</div>

<div class="section-container section-articles">
  <h2>📝 Articles</h2>
  <div class="cards">
    <app-article-card *ngFor="let article of articles" [article]="article"></app-article-card>
  </div>
  <app-progress-bar
    [title]="'📄 Articles Progress'"
    [progress]="50"
    [text]="'Completed 1/2 articles'">
  </app-progress-bar>
</div>

<div class="section-container section-exams">
  <h2>🎓 Exams</h2>
  <div class="exam-category">
    <h3>📘 PISA</h3>
    <app-exam-card [exam]="exams[0]"></app-exam-card>
  </div>
  <div class="exam-category">
    <h3>📗 TIMSS</h3>
    <app-exam-card [exam]="exams[1]"></app-exam-card>
  </div>
  <div class="exam-category">
    <h3>📙 PIRLS</h3>
    <app-exam-card [exam]="exams[2]"></app-exam-card>
  </div>
  <app-progress-bar
    [title]="'📝 Exams Progress'"
    [progress]="33"
    [text]="'Completed 1/3 exams'">
  </app-progress-bar>
</div>

</section>
