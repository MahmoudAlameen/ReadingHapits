<section class="learning-section" *ngIf="currentLang">
  <div class="container">
    <div class="content-wrapper">
      
      <div class="text-content">
        <h1 class="main-title">
          {{'The Smarter-More Enjoyable Learning Journey' | translate}}     
          <img class="vector-decoration" [src]="mainSectionMediaBaseUrl + 'main-section-vector-6-1.svg'" alt="" aria-hidden="true">
          <br>{{'Comprehensive E-Learning Platform' | translate}}.
        </h1>
        <p>{{'MAIN_CONTENT_PARAGRAPH' | translate}}</p>

        <div class="action-buttons">
          <button (click)="navigateToLearningMaterials()" class="btn btn-primary">
            {{ 'BUTTONS.MATERIALS' | translate }}
          </button>
          <button (click)="navigateToAssessments()" class="btn btn-secondary">
            {{ 'BUTTONS.ASSESSMENTS' | translate }}
          </button>
        </div>

        <div class="stats-grid">
          <div *ngFor="let stat of stats" class="stat-item">
            <div class="stat-number" [style.color]="stat.color">{{ stat.number }}</div>
            <div class="stat-label" [innerHTML]="stat.label"></div>
          </div>
        </div>
      </div>

      <div class="hero-image-wrapper">
        <div class="hero-image-container">
          <div class="background-elements">
            <img 
              *ngFor="let img of heroImages; let i = index"
              class="mask-overlay hero-image" 
              [src]="mainSectionMediaBaseUrl + img" 
              [class.active]="i === currentImageIndex"
              alt=""
              aria-hidden="true">
          </div>

          <img class="decoration decoration-purple" [src]="mainSectionMediaBaseUrl + 'main-section-purple-ellipse-1@2x.png'" aria-hidden="true">
          <img class="decoration decoration-yellow" [src]="mainSectionMediaBaseUrl + 'main-section-yello-ellipse-1@2x.png'" aria-hidden="true">
          <img class="decoration decoration-ellipse-1" [src]="mainSectionMediaBaseUrl + 'main-section-ellipse-10-1.svg'" aria-hidden="true">
          <img class="decoration decoration-ellipse-2" [src]="mainSectionMediaBaseUrl + 'main-section-ellipse-11-1.svg'" aria-hidden="true">
        </div>
      </div>

    </div>
  </div>
</section>
