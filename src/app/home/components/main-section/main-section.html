<section class="learning-section" *ngIf="currentLang">
  <div class="container">
    <!-- Content Section -->
    <div class="content-wrapper">
      <div class="text-content">
        <h1 class="main-title">{{'Learn a New Skill' | translate}}      <!-- Vector Decoration -->
        <img 
          class="vector-decoration" 
          src="https://c.animaapp.com/ASf1wC40/img/main-section-vector-6-1.svg" 
          alt="" 
          aria-hidden="true">
          <br>{{'Everyday, Anytime, and Anywhere' | translate}}.</h1>
        
        <p class="description">
          <span class="highlight">{{'1000+' | translate}}</span>
          <span class="regular-text">
            {{'Courses covering all tech domains' | translate}}
          </span>
        </p>

        <!-- Action Buttons -->
        <div class="action-buttons">
          <button
            (click)="navigateToLearningMaterials()" 
            class="btn btn-primary">
            {{ 'BUTTONS.MATERIALS' | translate }}
          </button>
          <button 
          (click)="navigateToAssessments()" 

            class="btn btn-secondary">
            {{ 'BUTTONS.ASSESSMENTS' | translate }}
          </button>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
          <div 
            *ngFor="let stat of stats" 
            class="stat-item">
            <div class="stat-number" [style.color]="stat.color">{{ stat.number}}</div>
            <div class="stat-label" [innerHTML]="stat.label"></div>
          </div>
        </div>
      </div>

      <!-- Hero Image Section -->
      <div class="hero-image-wrapper">
        <div class="hero-image-container">
          <!-- Background Elements -->
          <div class="background-elements">
            <div class="circle-border"></div>
            <div class="circle-bg"></div>
            <img 
              class="mask-overlay hero-image" 
              src="./assets/images/main-section/happy-young-woman-holding-laptop-gray-wall-transformed 2@2x.png" 
              alt=""
              aria-hidden="true">
              <!--https://c.animaapp.com/ASf1wC40/img/mask-group-1@2x.png-->
          </div>

          <!-- Main Hero Image -->

              
 
            <!--https://c.animaapp.com/ASf1wC40/img/happy-young-woman-holding-laptop-gray-wall-transformed-2-1.png-->
          <!-- Decorative Elements -->
           <!---->
          <img 
            class="decoration decoration-rock" 
            src="https://c.animaapp.com/ASf1wC40/img/main-section-rock-1@2x.png"
          
            alt="" 
            aria-hidden="true">
            <!--"https://c.animaapp.com/ASf1wC40/img/main-section-rock-1@2x.png" -->
          <img 
            class="decoration decoration-cup" 
            src="https://c.animaapp.com/ASf1wC40/img/main-section-cup-1@2x.png" 
            alt="" 
            aria-hidden="true">
          
          <img 
            class="decoration decoration-purple" 
            src="https://c.animaapp.com/ASf1wC40/img/main-section-purple-ellipse-1@2x.png" 
            alt="" 
            aria-hidden="true">
          
          <img 
            class="decoration decoration-yellow" 
            src="https://c.animaapp.com/ASf1wC40/img/main-section-yello-ellipse-1@2x.png" 
            alt="" 
            aria-hidden="true">
          
          <img 
            class="decoration decoration-ellipse-1" 
            src="https://c.animaapp.com/ASf1wC40/img/main-section-ellipse-10-1.svg" 
            alt="" 
            aria-hidden="true">
          
          <img 
            class="decoration decoration-ellipse-2" 
            src="https://c.animaapp.com/ASf1wC40/img/main-section-ellipse-11-1.svg" 
            alt="" 
            aria-hidden="true">
        </div>

      </div>
    </div>
  </div>
</section>
