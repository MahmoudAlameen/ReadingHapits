<div class="learning-materials-container" id ="learning-subjects">
  <header class="header">
    <h2 class="header-title">{{'Learning Materials' | translate}}</h2>
    <a href="javascript:void(0)" class="see-all-link" (click)="onSeeAll()">{{'See All' |translate}}</a>
  </header>

  <div class="cards-container">
    <app-learning-material-card 
      *ngFor="let material of materialsToShow" 
      [material]="material">
    </app-learning-material-card>
  </div>
</div>
