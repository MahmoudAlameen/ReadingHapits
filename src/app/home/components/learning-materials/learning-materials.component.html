<div class="learning-materials-container">
  <header  class="header">
    <h2 i18n class="header-title">Learning Materials</h2>
    <a i18n href="javascript:void(0)" class="see-all-link" (click)="onSeeAll()">See All</a>
  </header>

  <div class="cards-container">
    <app-learning-material-card 
      *ngFor="let material of materialsToShow" 
      [material]="material">
    </app-learning-material-card>
  </div>
</div>
